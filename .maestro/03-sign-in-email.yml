appId: ${APP_ID}
# Uses a pre-existing test account. Provide TEST_EMAIL + TEST_PASSWORD.
---
- launchApp:
    clearState: true
- tapOn:
    id: "cta-have-account"
- assertVisible: "Welcome back"
- tapOn:
    id: "sign-in-email"
- inputText: ${TEST_EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: ${TEST_PASSWORD}
- tapOn:
    id: "sign-in-submit"
- assertVisible:
    id: "home-subtitle"
    timeout: 15000
